name: check-upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 安装 Nix
        uses: determinatesystems/nix-installer-action@v16

      - name: 拉最新官方源码并更新 lock
        run: |
          set -euo pipefail
          nix flake lock --update-input qingjian 2>&1 | tail -3
          if git diff --quiet flake.lock; then
            echo "官方无更新，跳过"
            echo "UPDATED=false" >> "$GITHUB_ENV"
          else
            echo "官方有更新"
            echo "UPDATED=true" >> "$GITHUB_ENV"
          fi

      - name: 构建验证
        if: env.UPDATED == 'true'
        run: |
          set -uo pipefail
          build() {
            nix build .#qingjianServer .#qingjianData --no-link --print-build-logs \
              --option substituters "https://cache.nixos.org" 2>&1 | tee /tmp/build.log
          }
          if build; then
            echo "构建通过"
          else
            GOT=$(grep -oP 'got:\s+sha256-\S+' /tmp/build.log | head -1 | awk '{print $2}' || true)
            if [ -n "$GOT" ] && grep -q 'vendor.drv' /tmp/build.log; then
              echo "cargoHash 过期，更新为 $GOT"
              sed -i "s|cargoHash = \"[^\"]*\"|cargoHash = \"$GOT\"|" packages/server.nix
              build || { echo "::error::hash 修复后仍构建失败"; exit 1; }
            else
              echo "::error::构建失败（非 cargoHash：可能是官方数据 lock 变更或多块模型，需人工适配）"
              exit 1
            fi
          fi

      - name: 有更新则提交推送
        if: env.UPDATED == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock packages/server.nix
          if ! git diff --cached --quiet; then
            git commit -m "chore: 同步上游 qingjian 更新（lock + 必要时 cargoHash）"
            git push origin main
            echo "已推送"
          fi
